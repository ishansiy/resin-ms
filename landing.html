<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resin · 统一入口</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
         background:radial-gradient(1200px 600px at 50% -10%,#1d3557,#0b1220 60%); color:#e6edf6; }
  .card { width:min(680px,92vw); padding:32px 34px; border-radius:18px;
          background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.09);
          box-shadow:0 24px 60px rgba(0,0,0,.45); }
  h1 { margin:0 0 6px; font-size:22px; letter-spacing:.5px; }
  p.sub { margin:0 0 22px; color:#9db0c9; font-size:13px; }
  a.btn { display:inline-block; padding:10px 18px; border-radius:10px; text-decoration:none;
          background:#2f80c7; color:#fff; font-weight:600; transition:.15s; }
  a.btn:hover { background:#3f92d9; }
  ul { margin:22px 0 0; padding-left:20px; color:#c3d2e6; font-size:13.5px; }
  code { background:rgba(255,255,255,.08); padding:1px 6px; border-radius:5px; font-size:12.5px; }
  .tag { display:inline-block; margin-left:8px; padding:2px 8px; border-radius:999px;
         background:rgba(217,138,74,.16); color:#d98a4a; font-size:11.5px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Resin 已运行 <span class="tag">统一端口 7860</span></h1>
    <p class="sub">面板、管理 API、反代入口都在这一个端口上，按路径区分。</p>
    <a class="btn" href="/ui/">打开控制面板</a>
    <ul>
      <li>面板：<code>/ui/</code></li>
      <li>管理 API：<code>/api/v1/...</code>（<code>Authorization: Bearer &lt;管理令牌&gt;</code> 或 <code>X-Resin-Token</code>）</li>
      <li>反向代理：<code>/&lt;代理令牌&gt;/&lt;平台.账号&gt;/&lt;https|http&gt;/&lt;目标地址&gt;</code></li>
      <li>额外端点：<code>/e/1/</code> … <code>/e/5/</code> → 容器内 30001–30005</li>
      <li>健康检查：<code>/healthz</code></li>
    </ul>
  </div>
</body>
</html>
