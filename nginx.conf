worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr "$request" $status $body_bytes_sent rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time urt=$upstream_response_time';
    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 75;
    client_max_body_size 64m;
    server_tokens off;

    # ---------------------------------------------------------------------
    # 管理令牌三种投递方式（魔塔边缘会改写发往容器的 Authorization 头，
    # 面板自带的 Bearer 可能被顶掉，所以额外支持自定义头与 cookie）：
    #   1) X-Resin-Token: <admin token>      （脚本/API 客户端）
    #   2) cookie resin_admin=<admin token>  （浏览器，访问 /t/<token> 自动写入）
    #   3) Authorization: Bearer <token>     （直连/不受边缘影响时）
    # ---------------------------------------------------------------------
    map $http_x_resin_token $auth_header {
        ""      "";
        default "Bearer $http_x_resin_token";
    }
    map $cookie_resin_admin $auth_cookie {
        ""      "";
        default "Bearer $cookie_resin_admin";
    }
    map "$auth_header|$auth_cookie" $resin_admin_auth {
        "~^Bearer "     $auth_header;
        "~^\|Bearer "   $auth_cookie;
        default         $http_authorization;
    }

    upstream resin_main {
        server 127.0.0.1:2260;
        keepalive 32;
    }

    server {
        listen 7860 default_server;
        listen [::]:7860 default_server;
        server_name _;

        # Resin 的反代路径里 "./" 表示「不指定平台/账号」，nginx 默认会把点段规范化掉，
        # 所以关闭斜杠合并并在 catch-all 里原样透传 $request_uri。
        merge_slashes off;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 健康检查 / 平台探活
        location = /healthz {
            access_log off;
            proxy_pass http://resin_main/healthz;
        }

        # 落地页（200，避免平台探活被 302 判定为异常）
        location = / {
            root /usr/share/resin;
            try_files /index.html =404;
            add_header Cache-Control "no-store" always;
        }

        # 一次性登录：/t/<admin-token> → 写 cookie → 跳面板
        location ~ "^/t/(?<resin_tk>[A-Za-z0-9_.-]{8,128})$" {
            add_header Set-Cookie "resin_admin=$resin_tk; Path=/; Max-Age=31536000; SameSite=Lax" always;
            return 302 /ui/;
        }

        # 面板（静态资源 + SPA 路由）
        location /ui {
            proxy_pass http://resin_main;
            proxy_set_header Authorization $resin_admin_auth;
        }
        location /ui/ {
            proxy_pass http://resin_main;
            proxy_set_header Authorization $resin_admin_auth;
        }

        # 管理 API
        location /api/ {
            proxy_pass http://resin_main;
            proxy_set_header Authorization $resin_admin_auth;
            proxy_read_timeout 120s;
        }

        # 额外 Endpoint：每个 endpoint 原本各占一个端口，这里按路径收敛
        #   /e/1/ → 127.0.0.1:30001 ... /e/5/ → 127.0.0.1:30005
        location /e/1/ {
            proxy_pass http://127.0.0.1:30001/;
            proxy_set_header Authorization $http_x_resin_auth;
            proxy_set_header X-Resin-Auth "";
            proxy_read_timeout 300s;
            proxy_buffering off;
        }
        location /e/2/ {
            proxy_pass http://127.0.0.1:30002/;
            proxy_set_header Authorization $http_x_resin_auth;
            proxy_set_header X-Resin-Auth "";
            proxy_read_timeout 300s;
            proxy_buffering off;
        }
        location /e/3/ {
            proxy_pass http://127.0.0.1:30003/;
            proxy_set_header Authorization $http_x_resin_auth;
            proxy_set_header X-Resin-Auth "";
            proxy_read_timeout 300s;
            proxy_buffering off;
        }
        location /e/4/ {
            proxy_pass http://127.0.0.1:30004/;
            proxy_set_header Authorization $http_x_resin_auth;
            proxy_set_header X-Resin-Auth "";
            proxy_read_timeout 300s;
            proxy_buffering off;
        }
        location /e/5/ {
            proxy_pass http://127.0.0.1:30005/;
            proxy_set_header Authorization $http_x_resin_auth;
            proxy_set_header X-Resin-Auth "";
            proxy_read_timeout 300s;
            proxy_buffering off;
        }

        # 反向代理入口：/<令牌>/<平台.账号>/<协议>/<目标地址>
        # 路径原样透给 Resin。
        #
        # ⚠️ Authorization 必须由我们重建，不能透传 ms.fun 边缘注入的那一个：
        #   ms.fun（阿里云 PAI-EAS/FC 网关）会对发往容器的请求加自己的
        #   Authorization（base64 网关凭据），Resin 会把它原样转给目标站点 →
        #   既泄漏平台凭证，又让 ElevenLabs 这类"同时有 xi-api-key 和 Authorization
        #   就拒绝"的 API 直接 401，还会覆盖客户端自己的 Bearer。
        #   客户端要带业务 Authorization 时改用 X-Resin-Auth（原样透传，含 scheme）。
        #   没发 X-Resin-Auth → 值为空 → nginx 不发送该头。
        location / {
            proxy_pass http://resin_main$request_uri;
            proxy_set_header Authorization $http_x_resin_auth;
            proxy_set_header X-Resin-Auth "";

            # 顺带剥掉边缘/内部链路头，避免泄漏内网信息
            proxy_set_header Original-Host "";
            proxy_set_header Wl-Proxy-Client-Ip "";
            proxy_set_header Req-Start-Time "";
            proxy_set_header Web-Server-Type "";
            proxy_set_header Eagleeye-Rpcid "";
            proxy_set_header Eagleeye-Traceid "";
            proxy_set_header X-Fc-Session-Id "";
            proxy_set_header X-Fc-Trace-Id "";

            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_buffering off;
            proxy_request_buffering off;
        }
    }
}
